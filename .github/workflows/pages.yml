name: Website auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Website zusammenstellen und Links prüfen
        run: node scripts/build.mjs
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website-Dateien bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
